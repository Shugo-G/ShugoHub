services:
  shugo-dashboard:
    build: .
    container_name: shugo-tv-dashboard
    ports:
      - "8080:80"
    restart: unless-stopped
    volumes:
      - cam-hls:/usr/share/nginx/html/cam:ro
    networks:
      - shugohub-net
    depends_on:
      - ticket-api
      - camera-gateway

  ticket-api:
    build: ./ticket-api
    container_name: shugo-ticket-api
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - shugohub-net

  camera-gateway:
    build: ./camera-gateway
    container_name: shugo-camera-gateway
    restart: unless-stopped
    environment:
      - CAMERA_RTSP_URL=${CAMERA_RTSP_URL}
    volumes:
      - cam-hls:/hls
    networks:
      - shugohub-net

networks:
  shugohub-net:
    driver: bridge

volumes:
  cam-hls:
