services:
  shugo-dashboard:
    build: .
    container_name: shugo-tv-dashboard
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - shugohub-net
    depends_on:
      - ticket-api

  ticket-api:
    build: ./ticket-api
    container_name: shugo-ticket-api
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - shugohub-net

networks:
  shugohub-net:
    driver: bridge
