server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location /api/vms/ {
        proxy_pass         http://shugovision.dposs.gob.ar/api/vms/;
        proxy_set_header   Host shugovision.dposs.gob.ar;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        add_header Access-Control-Allow-Origin *;
    }

    location /api/hub/ {
        proxy_pass         http://relojes.dposs.gob.ar/api/hub/;
        proxy_set_header   Host relojes.dposs.gob.ar;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        add_header Access-Control-Allow-Origin *;
    }

    location /api/weather/ {
        proxy_pass         https://api.open-meteo.com/v1/;
        proxy_set_header   Host api.open-meteo.com;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        add_header Access-Control-Allow-Origin *;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
