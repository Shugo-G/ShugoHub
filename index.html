<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ShugoHub · TV Dashboard</title>
<meta name="viewport" content="width=1920">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #0a0e13;
  --bg-2:      #0f141b;
  --panel:     #131923;
  --panel-2:   #181f2b;
  --border:    #1f2735;
  --border-2:  #2a3445;
  --ink:       #e6ebf2;
  --ink-2:     #aab4c4;
  --ink-3:     #6b7689;
  --ink-4:     #424c5d;
  --accent:    oklch(0.78 0.12 200);
  --ok:        oklch(0.78 0.16 155);
  --warn:      oklch(0.82 0.16 85);
  --crit:      oklch(0.68 0.20 25);
  --info:      oklch(0.75 0.10 250);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Inter", -apple-system, system-ui, sans-serif;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

.mono { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; }

/* ============ Stage ============ */
.stage-wrap {
  position: fixed; inset: 0;
  overflow: hidden;
  background: #000;
}
.stage {
  width: 1920px; height: 1080px;
  position: absolute; top: 0; left: 0;
  transform-origin: 0 0;
  background:
    radial-gradient(1200px 600px at 70% -10%, rgba(56, 189, 248, 0.04), transparent 60%),
    radial-gradient(1000px 500px at 10% 110%, rgba(56, 189, 248, 0.03), transparent 60%),
    var(--bg);
  display: grid;
  grid-template-rows: 64px 110px 1fr 28px;
  gap: 14px;
  padding: 6px 8px 6px;
  position: relative;
}

/* ============ Top bar ============ */
.topbar {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 24px;
}
.brand { display: flex; align-items: center; gap: 14px; }
.brand-mark {
  width: 40px; height: 40px;
  border: 1px solid var(--border-2);
  border-radius: 8px;
  display: grid; place-items: center;
  background: linear-gradient(180deg, #18202c, #0f141b);
  position: relative;
}
.brand-mark::before {
  content: ""; position: absolute; inset: 7px;
  border: 1.5px solid var(--accent);
  border-radius: 4px; opacity: 0.9;
}
.brand-mark::after {
  content: ""; position: absolute;
  width: 8px; height: 8px;
  background: var(--accent); border-radius: 50%;
  box-shadow: 0 0 12px var(--accent);
}
.brand-text { display: flex; flex-direction: column; line-height: 1; }
.brand-name { font-size: 18px; font-weight: 700; letter-spacing: 0.18em; color: var(--ink); }
.brand-sub  { font-size: 11px; letter-spacing: 0.22em; color: var(--ink-3); margin-top: 6px; text-transform: uppercase; }
.brand-dot  { color: var(--accent); }

.clock-block { display: flex; align-items: baseline; gap: 18px; justify-content: center; }
.clock-time  { font-size: 32px; font-weight: 600; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
.clock-secs  { font-size: 20px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.clock-date  { font-size: 32px; font-weight: 600; letter-spacing: 0.08em; color: var(--ink-3); text-transform: uppercase; }
.clock-temp  { display: flex; align-items: center; gap: 8px; font-size: 32px; font-weight: 600; letter-spacing: 0.04em; color: var(--accent); font-variant-numeric: tabular-nums; }
.clock-div   { width: 1.5px; height: 38px; background: var(--border-2); border-radius: 2px; align-self: center; }

.topbar-right { display: flex; align-items: center; gap: 14px; justify-content: flex-end; }
.live-pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 12px; border-radius: 999px;
  border: 1px solid var(--border-2);
  background: rgba(20, 27, 38, 0.6);
  font-size: 11px; letter-spacing: 0.22em;
  color: var(--ink-2); text-transform: uppercase;
}
.live-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--ok); box-shadow: 0 0 10px var(--ok);
  animation: pulse 2s infinite ease-in-out;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

/* ============ Radio card ============ */
.radio {
  display: grid; grid-template-columns: auto 1fr auto;
  align-items: center; gap: 12px; width: 320px;
  padding: 8px 12px;
  background: rgba(20, 27, 38, 0.55);
  border: 1px solid var(--border); border-radius: 10px;
}
.radio-btn {
  width: 32px; height: 32px; border-radius: 50%;
  border: 1px solid var(--border-2); background: var(--panel-2);
  color: var(--ink); display: grid; place-items: center;
  cursor: pointer; transition: all 0.15s;
}
.radio-btn:hover { border-color: var(--accent); color: var(--accent); }
.radio-btn.playing { border-color: var(--accent); color: var(--accent); }
.radio-meta { display: flex; flex-direction: column; min-width: 0; }
.radio-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
.radio-genre { font-size: 10px; letter-spacing: 0.18em; color: var(--ink-3); text-transform: uppercase; margin-top: 2px; display: flex; align-items: center; gap: 6px; }
.radio-eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 9px; margin-left: 2px; }
.radio-eq span { width: 2px; background: var(--accent); border-radius: 1px; animation: eq 0.9s infinite ease-in-out; }
.radio-eq span:nth-child(1) { height: 60%; animation-delay: 0.0s; }
.radio-eq span:nth-child(2) { height: 100%; animation-delay: 0.2s; }
.radio-eq span:nth-child(3) { height: 40%; animation-delay: 0.4s; }
.radio-eq span:nth-child(4) { height: 80%; animation-delay: 0.1s; }
@keyframes eq { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }
.radio-vol { display: flex; align-items: center; gap: 6px; }
.radio-vol input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 70px; height: 3px; background: var(--border-2); border-radius: 2px; outline: none;
}
.radio-vol input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 11px; height: 11px; border-radius: 50%; background: var(--ink-2); cursor: pointer;
}
.radio-vol input[type="range"]::-moz-range-thumb {
  width: 11px; height: 11px; border-radius: 50%; background: var(--ink-2); border: none; cursor: pointer;
}
.radio-station-select {
  background: transparent; border: none; color: var(--ink-3);
  font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
  cursor: pointer; padding: 2px 4px; font-family: inherit;
}
.radio-station-select:hover { color: var(--accent); }
.radio-station-select option { background: var(--panel); color: var(--ink); }

/* ============ KPI strip ============ */
.kpis { display: grid; grid-template-columns: repeat(8, 1fr); gap: 12px; }
.kpi {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px;
  position: relative; overflow: hidden;
}
.kpi-label { font-size: 10px; letter-spacing: 0.22em; color: var(--ink-3); text-transform: uppercase; }
.kpi-row   { display: flex; align-items: baseline; gap: 8px; margin-top: 8px; }
.kpi-val   { font-size: 32px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi-hint  { position: absolute; right: 14px; top: 14px; font-size: 10px; letter-spacing: 0.18em; color: var(--ink-4); text-transform: uppercase; }
.kpi.ok    .kpi-val { color: var(--ok); }
.kpi.warn  .kpi-val { color: var(--warn); }
.kpi.crit  .kpi-val { color: var(--crit); }
.kpi.info  .kpi-val { color: var(--info); }
.kpi.muted .kpi-val { color: var(--ink); }

/* ============ Main panels ============ */
.main {
  display: grid;
  grid-template-columns: var(--split-left, 1fr) 6px var(--split-right, 1fr);
  gap: 0; min-height: 0;
}
.main > .panel:first-child { margin-right: 7px; }
.main > .panel:last-child  { margin-left: 7px; }

.split-handle {
  position: relative; cursor: col-resize;
  display: grid; place-items: center;
  align-self: stretch; user-select: none; touch-action: none;
}
.split-handle::before {
  content: ""; width: 2px; height: 100%;
  background: var(--border); border-radius: 2px; transition: background 0.15s;
}
.split-handle:hover::before, .split-handle.dragging::before {
  background: var(--accent); box-shadow: 0 0 10px var(--accent);
}
.split-handle .grip {
  position: absolute; width: 14px; height: 38px;
  border-radius: 8px; background: var(--panel-2);
  border: 1px solid var(--border-2);
  display: grid; place-items: center; gap: 2px;
  color: var(--ink-3); transition: border-color 0.15s, color 0.15s;
}
.split-handle:hover .grip, .split-handle.dragging .grip { border-color: var(--accent); color: var(--accent); }
.split-handle .grip i { display: block; width: 2px; height: 2px; background: currentColor; border-radius: 50%; }

.panel {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 12px; display: flex; flex-direction: column;
  min-height: 0; overflow: hidden;
}
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px 10px; border-bottom: 1px solid var(--border);
}
.panel-title {
  font-size: 12px; letter-spacing: 0.28em;
  color: var(--ink-2); text-transform: uppercase; font-weight: 600;
  display: flex; align-items: center; gap: 12px;
  min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.panel-title .accent-bar { width: 4px; height: 14px; background: var(--accent); border-radius: 2px; flex-shrink: 0; }
.panel-meta {
  display: flex; align-items: center; gap: 14px;
  font-size: 11px; letter-spacing: 0.14em;
  color: var(--ink-3); text-transform: uppercase;
  flex-shrink: 0; white-space: nowrap;
}
.panel-meta b { color: var(--ink); font-weight: 600; }
.panel-body { flex: 1; min-height: 0; padding: 12px 14px; overflow: hidden; }
.panel-link {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px; border: 1px solid var(--border-2); border-radius: 6px;
  font-size: 10px; letter-spacing: 0.18em; color: var(--ink-2);
  text-transform: uppercase; text-decoration: none;
  background: rgba(20, 27, 38, 0.6); transition: all 0.15s; font-weight: 600;
}
.panel-link:hover { border-color: var(--accent); color: var(--accent); }
.panel-link svg { width: 11px; height: 11px; }

/* ============ VM list ============ */
.vm-list { display: flex; flex-direction: column; height: 100%; overflow-y: auto; }
.vm-row {
  display: grid; grid-template-columns: 14px 1fr auto;
  align-items: center; gap: 16px;
  padding: 11px 8px;
  border-bottom: 1px solid rgba(31, 39, 53, 0.55);
}
.vm-row:last-child { border-bottom: none; }
.vm-row .dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--ok); box-shadow: 0 0 8px currentColor; color: var(--ok);
}
.vm-row.offline .dot { background: var(--crit); color: var(--crit); }
.vm-row-id { min-width: 0; }
.vm-row-name {
  font-size: 16px; font-weight: 700; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.vm-row-ip { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.vm-row-metrics { display: flex; align-items: center; gap: 20px; }
.vm-row-offline-msg {
  font-size: 13px; font-weight: 700; color: var(--crit);
  letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap;
}
.vm-metric { display: flex; align-items: center; gap: 8px; }
.vm-metric .lbl { font-size: 12px; color: var(--ink-3); width: 9px; }
.vm-metric .bar { width: 70px; height: 5px; border-radius: 3px; background: var(--border-2); overflow: hidden; }
.vm-metric .bar > span { display: block; height: 100%; border-radius: 3px; }
.vm-metric .bar .ok   { background: var(--ok); }
.vm-metric .bar .warn { background: var(--warn); }
.vm-metric .bar .crit { background: var(--crit); }
.vm-metric .val { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; width: 36px; text-align: right; }

/* ============ Clock list ============ */
.clock-table { width: 100%; height: 100%; display: flex; flex-direction: column; }
.clock-table-head {
  display: grid; grid-template-columns: 20px 1fr 110px;
  gap: 14px; padding: 6px 14px 8px;
  border-bottom: 1px solid var(--border);
  font-size: 10px; letter-spacing: 0.22em; color: var(--ink-4); text-transform: uppercase;
}
.clock-table-body { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
.clock-row {
  display: grid; grid-template-columns: 20px 1fr 110px;
  gap: 14px; align-items: center;
  padding: 0 14px; flex: 1; min-height: 0;
  border-bottom: 1px solid rgba(31, 39, 53, 0.6);
  position: relative; transition: background 0.15s;
}
.clock-row:hover { background: rgba(56, 189, 248, 0.04); }
.clock-row:last-child { border-bottom: none; }
.clock-row .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px currentColor; color: var(--ok); }
.clock-row.err   .dot { background: var(--crit); color: var(--crit); }
.clock-row.stale .dot { background: var(--warn); color: var(--warn); }
.clock-row .name  { font-size: 16px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.01em; }
.clock-row .last  { font-size: 15px; color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; }

/* ============ Main right side (relojes column + tickets/agentes column) ============ */
.main-cols { display: flex; gap: 14px; min-height: 0; margin-left: 7px; flex: 1; }
.main-cols > .panel { flex: 1.15; min-width: 0; min-height: 0; }
.main-right { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; }
.main-right .panel { min-height: 0; }
.tickets-panel { flex: 0 0 auto; }
.agents-panel { flex: 1; }

/* ============ Tickets panel ============ */
@keyframes tixFade { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: translateY(0); } }
.tix-rows { display: flex; flex-direction: column; gap: 10px; }
.tix-row {
  display: grid; grid-template-columns: 70px 1fr auto;
  align-items: center; gap: 16px;
  padding: 16px 18px; border-radius: 8px;
  background: rgba(20, 27, 38, 0.45);
  border: 1px solid var(--border);
  border-left: 4px solid var(--border-2);
  cursor: pointer; transition: background 0.15s, border-color 0.15s;
}
.tix-row:hover { background: rgba(56, 189, 248, 0.06); border-color: var(--border-2); }
.tix-row.pend { border-left-color: var(--crit); }
.tix-row.reab { border-left-color: var(--warn); }
.tix-row.info { border-left-color: var(--info); }
.tix-badge { display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.tix-badge .num { font-size: 36px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tix-badge .lbl { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); margin-top: 5px; }
.tix-row.pend .tix-badge .num { color: var(--crit); }
.tix-row.reab .tix-badge .num { color: var(--warn); }
.tix-row.info .tix-badge .num { color: var(--info); }
.tix-body { min-width: 0; overflow: hidden; }
.tix-title { font-size: 20px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: tixFade 0.4s ease; }
.tix-meta  { font-size: 15px; color: var(--ink-3); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: tixFade 0.4s ease; }
.tix-empty-row { font-size: 16px; color: var(--ink-4); font-style: italic; }
.tix-arrow { color: var(--ink-4); flex-shrink: 0; }

/* ============ Agentes panel ============ */
.agents-list { display: flex; flex-direction: column; gap: 6px; height: 100%; overflow-y: auto; }
.agent-row {
  display: grid; grid-template-columns: 52px 1fr auto;
  align-items: center; gap: 12px;
  padding: 7px 14px; border-radius: 8px;
  background: rgba(20, 27, 38, 0.45);
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  cursor: pointer; transition: background 0.15s, border-color 0.15s;
}
.agent-row:hover { background: rgba(56, 189, 248, 0.06); }
.agent-badge { display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.agent-badge .num { font-size: 21px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.agent-badge .lbl { font-size: 8px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); margin-top: 3px; }
.agent-body { min-width: 0; overflow: hidden; }
.agent-name { font-size: 14px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent-breakdown { font-size: 11px; color: var(--ink-3); margin-top: 3px; display: flex; gap: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
.agent-breakdown b { color: var(--ink-2); font-weight: 600; }
.agent-empty { font-size: 14px; color: var(--ink-4); font-style: italic; padding: 10px 4px; }

/* ============ Tickets modal ============ */
.tix-modal-overlay {
  position: absolute; inset: 0; z-index: 60;
  background: rgba(5, 8, 12, 0.72);
  display: flex; align-items: center; justify-content: center;
}
.tix-modal {
  width: 1180px; height: 860px; max-width: 94%; max-height: 92%;
  background: var(--panel); border: 1px solid var(--border-2);
  border-radius: 14px; display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
}
.tix-modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 22px; border-bottom: 1px solid var(--border);
}
.tix-modal-title {
  font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; font-weight: 700;
  color: var(--ink-2); display: flex; gap: 12px; align-items: center;
}
.tix-close {
  width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border-2);
  background: var(--panel-2); color: var(--ink-2); cursor: pointer; display: grid; place-items: center;
  transition: border-color 0.15s, color 0.15s;
}
.tix-close:hover { border-color: var(--crit); color: var(--crit); }
.tix-tabs { display: flex; gap: 6px; padding: 12px 22px 0; border-bottom: 1px solid var(--border); }
.tix-tab {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px; font-size: 12px; font-weight: 600; letter-spacing: 0.03em;
  color: var(--ink-3); cursor: pointer; border-bottom: 2px solid transparent; background: none; border-top: none; border-left: none; border-right: none;
  font-family: inherit;
}
.tix-tab .badge { background: var(--panel-2); border: 1px solid var(--border-2); border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 700; }
.tix-tab.active { color: var(--ink); }
.tix-tab.pend.active { border-bottom-color: var(--crit); }
.tix-tab.reab.active { border-bottom-color: var(--warn); }
.tix-tab.info.active { border-bottom-color: var(--info); }
.tix-tab.asig.active { border-bottom-color: var(--info); }
.tix-tab.proc.active { border-bottom-color: var(--warn); }
.tix-tab.mejo.active { border-bottom-color: var(--ok); }
.tix-tab.pend .badge { color: var(--crit); }
.tix-tab.reab .badge { color: var(--warn); }
.tix-tab.info .badge { color: var(--info); }
.tix-tab.asig .badge { color: var(--info); }
.tix-tab.proc .badge { color: var(--warn); }
.tix-tab.mejo .badge { color: var(--ok); }
.tix-list { flex: 1; overflow-y: auto; padding: 16px 22px; display: flex; flex-direction: column; gap: 12px; }
.tix-card { border-radius: 10px; padding: 14px 16px; background: var(--panel-2); border: 1px solid var(--border); border-left: 4px solid var(--border-2); }
.tix-card.pend { border-left-color: var(--crit); }
.tix-card.reab { border-left-color: var(--warn); }
.tix-card.info { border-left-color: var(--info); }
.tix-card.asig { border-left-color: var(--info); }
.tix-card.proc { border-left-color: var(--warn); }
.tix-card.mejo { border-left-color: var(--ok); }
.tix-card-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.tix-card-date { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.tix-card-area { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-3); }
.tix-card-title { font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
.tix-card-msg { font-size: 12.5px; color: var(--ink-2); line-height: 1.55; white-space: pre-line; }
.tix-empty-list { padding: 60px 20px; text-align: center; color: var(--ink-3); font-size: 13px; }

/* ============ Footer ============ */
.foot {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 6px; font-size: 10px; letter-spacing: 0.2em;
  color: var(--ink-4); text-transform: uppercase;
}
.foot .right { display: flex; gap: 20px; }

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    offsetRef.current = {
      x: Math.min(Math.max(PAD, window.innerWidth - w - PAD), Math.max(PAD, offsetRef.current.x)),
      y: Math.min(Math.max(PAD, window.innerHeight - h - PAD), Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right  = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd">
          <b>{title}</b>
          <button className="twk-x" onClick={() => { setOpen(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); }}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ title, children }) { return (<><div className="twk-sect">{title}</div>{children}</>); }
function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl"><span>{label}</span>{value != null && <span className="twk-val">{value}</span>}</div>
      {children}
    </div>
  );
}
function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step} value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}
function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'} onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}
function TweakText({ label, value, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}
function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => { const v = typeof o === 'object' ? o.value : o; const l = typeof o === 'object' ? o.label : o; return <option key={v} value={v}>{l}</option>; })}
      </select>
    </TweakRow>
  );
}

Object.assign(window, { useTweaks, TweaksPanel, TweakSection, TweakRow, TweakSlider, TweakToggle, TweakText, TweakSelect });

function normalizeVM(v) {
  const s = v.latest_status || {};
  const noData = !v.latest_status;
  const cpu  = parseFloat(s.cpu_usage    ?? 0) || 0;
  const ram  = parseFloat(s.ram_percent  ?? 0) || 0;
  const disk = parseFloat(s.disk_percent ?? 0) || 0;

  const tsRaw = s.timestamp || s.created_at || s.recorded_at || v.last_seen || v.updated_at;
  const staleByTime = tsRaw ? (Date.now() - new Date(tsRaw).getTime() > 3 * 60 * 1000) : false;

  let status = 'online';
  if (noData || v.is_stale || staleByTime) {
    status = 'offline';
  } else if (cpu > 80 || ram > 80 || disk > 80) {
    status = 'crit';
  } else if (cpu > 50 || ram > 50 || disk > 50) {
    status = 'warn';
  }

  return {
    name: v.display_name || v.hostname || v.name || '?',
    ip:   v.ip_address   || v.ip       || '',
    cpu, ram, disk, status,
    lastSeen: tsRaw || null,
    warn: 0, crit: 0,
  };
}

function normalizeClock(c) {

    idadm:  c.idadm   ?? '',
    last,

  };
}

<script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

const API_VMS      = '/api/vms/';
const API_HUB      = '/api/hub/';
const API_TICKETS  = '/api/tickets/';
const API_ASSIGNED = '/api/tickets/assigned';
const POLL_VMS_MS      = 30_000;
const POLL_HUB_MS      = 60_000;
const POLL_TICKETS_MS  = 30_000;
const POLL_ASSIGNED_MS = 30_000;
const TICKET_ROTATE_MS = 5_000;

// ---------- Helpers ----------
const pad2 = (n) => String(n).padStart(2, "0");
const fmtTime = (d) => `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
const fmtSec  = (d) => pad2(d.getSeconds());
const fmtDate = (d) => {
  const days   = ["DOM","LUN","MAR","MIE","JUE","VIE","SAB"];
  const months = ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
  return `${days[d.getDay()]} ${pad2(d.getDate())} ${months[d.getMonth()]} ${d.getFullYear()}`;
};

function useClock() {
  const [t, setT] = useState(new Date());
  useEffect(() => { const id = setInterval(() => setT(new Date()), 1000); return () => clearInterval(id); }, []);
  return t;
}

// ---------- TopBar ----------
function TopBar({ station, onStation, playing, onTogglePlay, vol, onVol, temp }) {
  const now = useClock();

    <div className="topbar">
      <div className="brand">
        <div className="brand-mark"></div>

          <span className="clock-time mono">{fmtTime(now)}</span>

        </div>

// ---------- KPIs ----------
function Kpis({ vms, clocks, lastCycle, fichadas }) {
  const onlineVms  = vms.filter(v => v.status !== "offline").length;
  const warnVms    = vms.filter(v => v.status === "warn").length;
  const critVms    = vms.filter(v => v.status === "crit").length;
  const offlineVms = vms.filter(v => v.status === "offline").length;
  const okClocks   = clocks.filter(c => c.status === "ok").length;
  const errClocks  = clocks.filter(c => c.status !== "ok").length;

  const items = [
    { label: "VMs ONLINE",   val: `${onlineVms}/${vms.length}`, tone: "ok",   hint: "Servidores" },
    { label: "VMs WARN",     val: warnVms,    tone: warnVms    ? "warn" : "muted", hint: "Servidores" },
    { label: "VMs CRIT",     val: critVms,    tone: critVms    ? "crit" : "muted", hint: "Servidores" },
    { label: "Offline",      val: offlineVms, tone: offlineVms ? "crit" : "muted", hint: "Servidores" },
    { label: "Relojes OK",   val: `${okClocks}/${clocks.length}`, tone: "ok", hint: "Relojes" },
    { label: "Con error",    val: errClocks,  tone: errClocks  ? "crit" : "muted", hint: "Relojes" },
    { label: "Último ciclo", val: lastCycle, tone: "info",   hint: "Relojes", small: true },
    { label: "Fichadas",     val: fichadas,  tone: "muted",  hint: "Último ciclo" },
  ];

  return (
    <div className="kpis">
      {items.map((k, i) => (
        <div key={i} className={"kpi " + k.tone}>
          <div className="kpi-label">{k.label}</div>
          <div className="kpi-hint">{k.hint}</div>
          <div className="kpi-row">
            <div className="kpi-val mono" style={k.small ? { fontSize: 20 } : null}>{k.val}</div>
          </div>
        </div>
      ))}
    </div>
  );
}

// ---------- Splitter ----------
function Splitter({ pct, onChange }) {
  const [dragging, setDragging] = useState(false);
  const ref = useRef(null);
  const onDown = (e) => {
    e.preventDefault();
    setDragging(true);
    const main = ref.current && ref.current.parentElement;
    if (!main) return;
    const move = (ev) => {
      const rect = main.getBoundingClientRect();
      const x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - rect.left;
      let p = Math.max(20, Math.min(80, Math.round((x / rect.width) * 100)));
      onChange(p);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
  };
  return (
    <div ref={ref} className={"split-handle " + (dragging ? "dragging" : "")}
      onMouseDown={onDown} title="Arrastrar para redimensionar">
      <div className="grip"><i></i><i></i><i></i></div>
    </div>
  );
}

// ---------- Gauge ----------
function VMMetric({ label, value }) {
  const tone = value > 80 ? "crit" : value > 50 ? "warn" : "ok";
  return (
    <div className="vm-metric">
      <span className="lbl">{label}</span>
      <span className="bar"><span className={tone} style={{ width: `${Math.min(100, value)}%` }}></span></span>
      <span className="val mono">{(+value).toFixed(1)}</span>
    </div>
  );
}

function fmtAgo(iso) {
  if (!iso) return null;
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (isNaN(mins) || mins < 0) return null;
  if (mins < 60) return `${mins} min`;
  const hours = Math.round(mins / 60);
  if (hours < 24) return `${hours} h`;
  return `${Math.round(hours / 24)} d`;
}

// ---------- VM row ----------
function VMRow({ vm }) {
  const isOffline = vm.status === "offline";
  const ago = fmtAgo(vm.lastSeen);
  return (
    <div className={"vm-row " + (isOffline ? "offline" : "")}>
      <span className="dot"></span>
      <div className="vm-row-id">
        <div className="vm-row-name">{vm.name}</div>
        <div className="vm-row-ip mono">{vm.ip}</div>
      </div>
      {isOffline ? (
        <div className="vm-row-offline-msg">Offline{ago ? ` · Sin respuesta hace ${ago}` : " · Sin conexión"}</div>
      ) : (
        <div className="vm-row-metrics">
          <VMMetric label="c" value={vm.cpu} />
          <VMMetric label="r" value={vm.ram} />
          <VMMetric label="d" value={vm.disk} />
        </div>
      )}
    </div>
  );
}

// ---------- Clock row ----------
function ClockRow({ c }) {
  const cls = c.status === "ok" ? "" : c.status === "stale" ? "stale" : "err";
  return (
    <div className={"clock-row " + cls}>
      <span className="dot"></span>
      <div className="name">{c.name}</div>
      <div className="last mono">{c.last}</div>
    </div>
  );
}

// ---------- Tickets ----------
const TICKET_CATS = [
  { key: "pendientes", cls: "pend", badge: "PEND", tab: "Pendientes" },
  { key: "reabiertos", cls: "reab", badge: "REAB", tab: "Reabiertos" },
  { key: "infoextra",  cls: "info", badge: "INFO", tab: "Info. extra" },
];

function fmtTicketDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  return `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

function TicketsPanel({ tickets, onOpen }) {
  const [tick, setTick] = useState(0);
  useEffect(() => {
    const id = setInterval(() => setTick((x) => x + 1), TICKET_ROTATE_MS);
    return () => clearInterval(id);
  }, []);

  return (
    <div className="tix-rows">
      {TICKET_CATS.map((cat) => {
        const list = tickets[cat.key] || [];
        const item = list.length ? list[tick % list.length] : null;
        return (
          <div key={cat.key} className={"tix-row " + cat.cls} onClick={() => onOpen(cat.key)}>
            <div className="tix-badge">
              <span className="num mono">{list.length}</span>
              <span className="lbl">{cat.badge}</span>
            </div>
            {item ? (
              <div className="tix-body">
                <div className="tix-title" key={"t" + item.id}>{item.title}</div>
                <div className="tix-meta" key={"m" + item.id}>{item.area || "General"} · {fmtTicketDate(item.date)}</div>
              </div>
            ) : (
              <div className="tix-empty-row">Sin tickets</div>
            )}
            <svg className="tix-arrow" width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M4 2l4 4-4 4"/></svg>
          </div>
        );
      })}
    </div>
  );
}

function CategoryTicketsModal({ title, cats, data, initialTab, onClose }) {
  const [tab, setTab] = useState(initialTab || cats[0].key);
  const list = data[tab] || [];
  const cat = cats.find((c) => c.key === tab);

  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);

  return (
    <div className="tix-modal-overlay" onClick={onClose}>
      <div className="tix-modal" onClick={(e) => e.stopPropagation()}>
        <div className="tix-modal-head">
          <div className="tix-modal-title"><span className="accent-bar"></span>{title}</div>
          <button className="tix-close" onClick={onClose} aria-label="Cerrar">
            <svg width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M2 2l8 8M10 2l-8 8"/></svg>
          </button>
        </div>
        <div className="tix-tabs">
          {cats.map((c) => (
            <button key={c.key} className={"tix-tab " + c.cls + (tab === c.key ? " active" : "")} onClick={() => setTab(c.key)}>
              {c.tab} <span className="badge mono">{(data[c.key] || []).length}</span>
            </button>
          ))}
        </div>
        <div className="tix-list">
          {list.length === 0 && <div className="tix-empty-list">No hay tickets en esta categoría.</div>}
          {list.map((tk) => (
            <div key={tk.id} className={"tix-card " + cat.cls}>
              <div className="tix-card-top">
                <span className="tix-card-date mono">#{tk.id} · {fmtTicketDate(tk.date)}</span>
                <span className="tix-card-area">{tk.area || "General"}</span>
              </div>
              <div className="tix-card-title">{tk.title}</div>
              <div className="tix-card-msg">{tk.message}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ---------- Agentes (tickets asignados) ----------
const AGENT_CATS = [
  { key: "asignados", cls: "asig", badge: "ASIG", tab: "Asignados" },
  { key: "enproceso", cls: "proc", badge: "PROC", tab: "En proceso" },
  { key: "mejoras",   cls: "mejo", badge: "MEJ",  tab: "Mejoras" },
];

function AgentsPanel({ agents, onOpen }) {
  if (!agents.length) return <div className="agent-empty">Sin tickets asignados</div>;
  return (
    <div className="agents-list">
      {agents.map((ag) => (
        <div key={ag.idadm} className="agent-row" onClick={() => onOpen(ag)}>
          <div className="agent-badge">
            <span className="num mono">{ag.total}</span>
            <span className="lbl">TICK.</span>
          </div>
          <div className="agent-body">
            <div className="agent-name">{ag.nombre}</div>
            <div className="agent-breakdown">
              <span><b className="mono">{ag.counts.asignados}</b> asig</span>
              <span><b className="mono">{ag.counts.enproceso}</b> proc</span>
              <span><b className="mono">{ag.counts.mejoras}</b> mej</span>
            </div>
          </div>
          <svg className="tix-arrow" width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M4 2l4 4-4 4"/></svg>
        </div>
      ))}
    </div>
  );
}

// ---------- App ----------
function App() {
  const [t, setTweak] = window.useTweaks({
    "dense":          false,
    "stationUrl":     "https://playerservices.streamtheworld.com/api/livestream-redirect/ASPEN.mp3",
    "shugoVisionUrl": "http://shugovision.dposs.gob.ar",
    "shugoTimeUrl":   "http://relojes.dposs.gob.ar",
    "splitPct":       37,
    "splitPct2":      45,
  });

  const audioRef = useRef(null);
  const [playing, setPlaying] = useState(false);
  const [vol, setVol]         = useState(100);

  // -- live API data --
  const [vms,      setVms]      = useState(window.VMS_MOCK);
  const [clocks,   setClocks]   = useState(window.CLOCKS_MOCK);
  const [lastFetch, setLastFetch]     = useState(null);
  const [fichadas, setFichadas]       = useState(0);
  const [lastCycleStr, setLastCycleStr] = useState(null);
  const [temp, setTemp] = useState(null);
  const [tickets, setTickets] = useState({ pendientes: [], reabiertos: [], infoextra: [] });
  const [ticketsModalTab, setTicketsModalTab] = useState(null);
  const [agents, setAgents] = useState([]);
  const [agentModal, setAgentModal] = useState(null);

  // Temperatura Ushuaia: actualizar cada 10 min
  useEffect(() => {
    async function fetchTemp() {
      try {
        const r = await fetch('/api/weather/forecast?latitude=-54.8019&longitude=-68.3030&current=temperature_2m');
        if (!r.ok) throw new Error(r.status);
        const data = await r.json();
        const t = data.current?.temperature_2m;
        if (t != null) setTemp(Math.round(t));
      } catch(e) {
        console.warn('[ShugoHub] Weather fetch:', e.message);
      }
    }
    fetchTemp();
    const id = setInterval(fetchTemp, 10 * 60 * 1000);
    return () => clearInterval(id);
  }, []);

  // VMs: poll every 10s
  useEffect(() => {
    async function loadVMs() {
      try {
        const r = await fetch(API_VMS);
        if (!r.ok) throw new Error(r.status);
        const raw = await r.json();
        const arr = Array.isArray(raw) ? raw : (raw.data || raw.vms || raw.results || []);
        setVms(arr.map(window.normalizeVM));
        setLastFetch(new Date());
      } catch (e) {
        console.warn('[ShugoHub] VMs fetch:', e.message);
      }
    }
    loadVMs();
    const id = setInterval(loadVMs, POLL_VMS_MS);
    return () => clearInterval(id);
  }, []);

  // Relojes: poll every 30s
  useEffect(() => {
    async function loadHub() {
      try {
        const r = await fetch(API_HUB);
        if (!r.ok) throw new Error(r.status);
        const raw = await r.json();
        const arr = raw.relojes || (Array.isArray(raw) ? raw : (raw.data || raw.clocks || []));
        setClocks(arr.map(window.normalizeClock));
        if (raw.ultimo_ciclo_fichadas != null) setFichadas(raw.ultimo_ciclo_fichadas);
        if (raw.ultimo_ciclo_inicio) {
          const parts = raw.ultimo_ciclo_inicio.split(' ');
          setLastCycleStr(parts[1] || raw.ultimo_ciclo_inicio);
        }
      } catch (e) {
        console.warn('[ShugoHub] Hub fetch:', e.message);
      }
    }
    loadHub();
    const id = setInterval(loadHub, POLL_HUB_MS);
    return () => clearInterval(id);
  }, []);

  // Tickets mesa de ayuda: poll every 30s
  useEffect(() => {
    async function loadTickets() {
      try {
        const r = await fetch(API_TICKETS);
        if (!r.ok) throw new Error(r.status);
        const raw = await r.json();
        setTickets({
          pendientes: raw.pendientes || [],
          reabiertos: raw.reabiertos || [],
          infoextra:  raw.infoextra  || [],
        });
      } catch (e) {
        console.warn('[ShugoHub] Tickets fetch:', e.message);
      }
    }
    loadTickets();
    const id = setInterval(loadTickets, POLL_TICKETS_MS);
    return () => clearInterval(id);
  }, []);

  // Tickets asignados a agentes: poll every 30s
  useEffect(() => {
    async function loadAssigned() {
      try {
        const r = await fetch(API_ASSIGNED);
        if (!r.ok) throw new Error(r.status);
        const raw = await r.json();
        setAgents(raw.agentes || []);
      } catch (e) {
        console.warn('[ShugoHub] Assigned tickets fetch:', e.message);
      }
    }
    loadAssigned();
    const id = setInterval(loadAssigned, POLL_ASSIGNED_MS);
    return () => clearInterval(id);
  }, []);

  const lastCycle = lastCycleStr || (lastFetch
    ? `${pad2(lastFetch.getHours())}:${pad2(lastFetch.getMinutes())}:${pad2(lastFetch.getSeconds())}`
    : '…');

  const station = useMemo(
    () => window.RADIO_STATIONS.find(s => s.url === t.stationUrl) || window.RADIO_STATIONS[0],
    [t.stationUrl]
  );

  useEffect(() => { if (audioRef.current) audioRef.current.volume = vol / 100; }, [vol]);
  useEffect(() => {
    if (!audioRef.current) return;
    audioRef.current.src = station.url;
    if (playing) audioRef.current.play().catch(() => setPlaying(false));
  }, [station.url]);

  const togglePlay = () => {
    if (!audioRef.current) return;
    if (playing) { audioRef.current.pause(); setPlaying(false); }
    else audioRef.current.play().then(() => setPlaying(true)).catch(() => setPlaying(false));
  };

  useEffect(() => { document.body.classList.toggle("dense", !!t.dense); }, [t.dense]);

  // Stage scale-to-fill (independent X/Y so no black bars)
  useEffect(() => {
    const onResize = () => {
      const stage = document.querySelector(".stage");
      if (!stage) return;
      stage.style.transform = `scale(${window.innerWidth / 1920}, ${window.innerHeight / 1080})`;
    };
    onResize();
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  return (
    <div className="stage-wrap">
      <audio ref={audioRef} preload="none" crossOrigin="anonymous"></audio>
      <div className="stage">
        <TopBar station={station} onStation={(s) => setTweak("stationUrl", s.url)}
          playing={playing} onTogglePlay={togglePlay} vol={vol} onVol={setVol} temp={temp} />

        <Kpis vms={vms} clocks={clocks} lastCycle={lastCycle} fichadas={fichadas} />

        <div className="main" style={{
          "--split-left":  `${t.splitPct}fr`,
          "--split-right": `${100 - t.splitPct}fr`,
        }}>
          {/* SERVIDORES */}
          <div className="panel">
            <div className="panel-head">
              <div className="panel-title"><span className="accent-bar"></span>Servidores · ShugoVision</div>
              <div className="panel-meta">
                <span><b className="mono">{vms.length}</b> totales</span>
                <span><b className="mono" style={{ color: "var(--ok)" }}>{vms.filter(v => v.status !== "offline").length}</b> online</span>
                <span><b className="mono" style={{ color: "var(--warn)" }}>{vms.filter(v => v.status === "warn").length}</b> warn</span>
                <a className="panel-link" href={t.shugoVisionUrl} target="_blank" rel="noopener noreferrer">
                  Abrir <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M4 8l4-4M4.5 3.5H8.5V7.5"/></svg>
                </a>
              </div>
            </div>
            <div className="panel-body">
              <div className="vm-list">{vms.map(v => <VMRow key={v.name} vm={v} />)}</div>
            </div>
          </div>

          <Splitter pct={t.splitPct} onChange={(v) => setTweak("splitPct", v)} />

          <div className="main-cols">
            {/* RELOJES */}
            <div className="panel" style={{ flex: t.splitPct2 }}>
              <div className="panel-head">
                <div className="panel-title" title="Relojes · ShugoTime"><span className="accent-bar"></span>Relojes</div>
                <div className="panel-meta">
                  <span title={`${clocks.filter(c => c.status !== "ok").length} con error`}>
                    <b className="mono" style={{ color: "var(--ok)" }}>{clocks.filter(c => c.status === "ok").length}</b>/<b className="mono">{clocks.length}</b>
                  </span>
                  <a className="panel-link" href={t.shugoTimeUrl} target="_blank" rel="noopener noreferrer" title="ShugoTime">
                    <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M4 8l4-4M4.5 3.5H8.5V7.5"/></svg>
                  </a>
                </div>
              </div>
              <div className="panel-body" style={{ padding: "6px 8px" }}>
                <div className="clock-table">
                  <div className="clock-table-head">
                    <span></span><span>Reloj</span><span>Último ciclo</span>
                  </div>
                  <div className="clock-table-body">
                    {[...clocks].sort((a, b) => (a.status === "ok") - (b.status === "ok")).map(c => <ClockRow key={c.name} c={c} />)}
                  </div>
                </div>
              </div>
            </div>

            <Splitter pct={t.splitPct2} onChange={(v) => setTweak("splitPct2", v)} />

            <div className="main-right" style={{ flex: 100 - t.splitPct2 }}>
              {/* TICKETS */}
              <div className="panel tickets-panel">
                <div className="panel-head">
                  <div className="panel-title" title="Tickets · Mesa de ayuda"><span className="accent-bar"></span>Tickets</div>
                  <div className="panel-meta">
                    <a className="panel-link" href="#" onClick={(e) => { e.preventDefault(); setTicketsModalTab("pendientes"); }}>
                      Abrir <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M4 8l4-4M4.5 3.5H8.5V7.5"/></svg>
                    </a>
                  </div>
                </div>
                <div className="panel-body">
                  <TicketsPanel tickets={tickets} onOpen={setTicketsModalTab} />
                </div>
              </div>

              {/* AGENTES */}
              <div className="panel agents-panel">
                <div className="panel-head">
                  <div className="panel-title" title="Agentes · Tickets asignados"><span className="accent-bar"></span>Agentes</div>
                  <div className="panel-meta">
                    <span><b className="mono">{agents.length}</b></span>
                  </div>
                </div>
                <div className="panel-body">
                  <AgentsPanel agents={agents} onOpen={(ag) => {
                    const first = AGENT_CATS.find((c) => ag.counts[c.key] > 0);
                    setAgentModal({ ...ag, initialTab: first ? first.key : "asignados" });
                  }} />
                </div>
              </div>
            </div>
          </div>
        </div>

        {ticketsModalTab && (
          <CategoryTicketsModal title="Tickets · Mesa de ayuda" cats={TICKET_CATS} data={tickets}
            initialTab={ticketsModalTab} onClose={() => setTicketsModalTab(null)} />
        )}

        {agentModal && (
          <CategoryTicketsModal title={`Tickets asignados · ${agentModal.nombre}`} cats={AGENT_CATS} data={agentModal.tickets}
            initialTab={agentModal.initialTab} onClose={() => setAgentModal(null)} />
        )}

        <div className="foot mono">
          <div>SHUGOHUB · DPOSS · Ushuaia, Tierra del Fuego</div>
          <div className="right">
            <span className="cycle"><span className="cycle-tick"></span> VMs cada 30s · relojes cada 60s · tickets/agentes cada 30s</span>
            <span>auto-refresh activo</span>
            <span>v2.0</span>
          </div>
        </div>
      </div>

      {/* Tweaks panel (activable desde design tool) */}
      {React.createElement(TweaksPanel_UI)}
    </div>
  );
}

function TweaksPanel_UI() {
  const [t, setTweak] = window.useTweaks({
    "dense": false, "stationUrl": "https://ice2.somafm.com/groovesalad-128-mp3",
    "shugoVisionUrl": "http://shugovision.dposs.gob.ar",
    "shugoTimeUrl":   "http://relojes.dposs.gob.ar",
    "splitPct": 37, "splitPct2": 45,
  });
  const { TweaksPanel, TweakSection, TweakSlider, TweakToggle, TweakText, TweakSelect } = window;
  if (!TweaksPanel) return null;
  return (
    <TweaksPanel title="Tweaks">
      <TweakSection title="Accesos">
        <TweakText label="ShugoVision URL" value={t.shugoVisionUrl} onChange={(v) => setTweak("shugoVisionUrl", v)} />
        <TweakText label="ShugoTime URL"   value={t.shugoTimeUrl}   onChange={(v) => setTweak("shugoTimeUrl", v)} />
      </TweakSection>
      <TweakSection title="Layout">
        <TweakSlider label="División servidores/resto" value={t.splitPct}  onChange={(v) => setTweak("splitPct", v)}  min={20} max={80} step={1} unit="%" />
        <TweakSlider label="División relojes/tickets"  value={t.splitPct2} onChange={(v) => setTweak("splitPct2", v)} min={20} max={80} step={1} unit="%" />
        <TweakToggle label="Modo denso" value={t.dense} onChange={(v) => setTweak("dense", v)} />
      </TweakSection>
      <TweakSection title="Radio">
        <TweakSelect label="Estación" value={t.stationUrl} onChange={(v) => setTweak("stationUrl", v)}
          options={window.RADIO_STATIONS.map(s => ({ label: s.name, value: s.url }))} />
      </TweakSection>
    </TweaksPanel>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
